<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>

<script type="text/javascript">
	function send(f) {
		let title = f.title.value.trim();
		let photo = f.photo.value;
		
		if(title==""){
			alert("제목을 입력하세요!!");
			f.title.value="";
			f.title.focus();
			return;
		}
		
		if(photo==""){
			alert("사진을 선택하세요!!");
			return;
		}
		
		f.action="upload1.do"
		f.submit();//전송(제출)
	}
</script>
</head>
<body>

<form method="POST" enctype="multipart/form-data">
	제목:<input name="title"><br>
	사진:<input type="file" name="photo"><br>
		<input type="button" value="사진올리기" onclick="send(this.form);">
	 

</form>
</body>
</html>
